apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlink-{{ .Values.streamer.name }}

spec:
  replicas: 1
  # Never run two recorders/converters on the same streamer folder during an upgrade.
  # rollingUpdate: null clears the server-defaulted field on existing Deployments.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: streamlink-{{ .Values.streamer.name }}
  template:
    metadata:
      annotations:
        # Restart the pod when the streamer config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app: streamlink-{{ .Values.streamer.name }}
    spec:
      serviceAccountName: streamlink-{{ .Values.streamer.name }}
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      containers:
      - name: streamlink-{{ .Values.streamer.name }}
        image: "{{ .Values.image.streamlink.repository }}/{{ .Values.image.streamlink.name }}:{{ .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.streamlink.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources.streamlink }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.livenessProbe.enabled }}
        # The recorder touches the heartbeat file every loop iteration and every
        # 30s while recording; restart it when the file gets older than the
        # longest normal sleep, max(timer, 600s error backoff), plus a margin.
        {{- $maxAge := .Values.livenessProbe.maxHeartbeatAgeSeconds | default (add (max (int .Values.streamer.timer) 600) 300) }}
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "import os,sys,time; sys.exit(time.time() - os.stat('/tmp/streamlink-recorder.heartbeat').st_mtime > {{ int $maxAge }})"
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: streamlink-config-{{ .Values.streamer.name }}
        - secretRef:
            name: {{ .Values.secretName }}
        volumeMounts:
        - name: download-volume
          mountPath: /app/download
          subPath: {{ .Values.streamer.name }}
        - name: tmp-streamlink
          mountPath: /tmp

      - name: ffmpeg-{{ .Values.streamer.name }}
        image: "{{ .Values.image.ffmpeg.repository }}/{{ .Values.image.ffmpeg.name }}:{{ .Values.image.ffmpeg.tag }}"
        imagePullPolicy: {{ .Values.image.ffmpeg.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources.ffmpeg }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: SLEEPTIME
          value: "{{ .Values.ffmpeg.sleeptime }}"
        - name: WORKDIR
          value: "{{ .Values.ffmpeg.workdir }}"
        volumeMounts:
        - name: download-volume
          mountPath: /app/download
          subPath: {{ .Values.streamer.name }}
        - name: tmp-ffmpeg
          mountPath: /tmp

      volumes:
      - name: download-volume
        nfs:
          server: {{ .Values.nfs.server }}
          path: {{ .Values.nfs.path }}
      - name: tmp-streamlink
        emptyDir:
          sizeLimit: {{ .Values.tmpSizeLimit }}
      - name: tmp-ffmpeg
        emptyDir:
          sizeLimit: {{ .Values.tmpSizeLimit }}
