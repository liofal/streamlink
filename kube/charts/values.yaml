image:
  streamlink:
    repository: ghcr.io/liofal
    name: streamlink
    # tag is now derived from Chart.AppVersion in templates
    pullPolicy: Always
  ffmpeg: 
    repository: ghcr.io/liofal
    name: ffmpeg
    tag: 1.0.1
    pullPolicy: Always

streamer:
  name: "<name_here>"
  twitchName: "<twitch_name_here>"
  quality: "best"
  timer: 120

# Name of the Kubernetes Secret containing sensitive tokens.
# This secret should contain keys like clientid, clientsecret, oauthtoken, etc.
# It's recommended to use one shared secret for all deployments of this chart.
# Create this secret manually before deploying the chart.
# See templates/secret.example.yaml for the required structure.
secretName: "streamlink-secrets" # Default name for the shared secret

ffmpeg:
  sleeptime: "<sleeptime_value>"
  # Must be the mounted download directory (/app/download): the root filesystem
  # is read-only, so any other path makes the sidecar fail at startup.
  workdir: "<workdir_value>"

nfs:
  server: <server_ip_here>
  path: /<volume>/<folder>

# Both containers run as this non-root user/group. It must own (or be able to
# write) the NFS folder of each streamer. Before deploying:
#   - on the NAS: chown -R 1027:100 /<volume>/<folder>/<streamer.name>
#   - for a new streamer, pre-create /<volume>/<folder>/<streamer.name> owned by
#     1027:100. Otherwise kubelet creates the subPath folder as root and the
#     recorder cannot write to it.
# fsGroup only adds a supplemental group; Kubernetes does not chown NFS volumes.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1027
  runAsGroup: 100
  fsGroup: 100

# Container-level hardening, applied to the recorder and the ffmpeg sidecar.
# /tmp is an emptyDir in each container; all recordings go to the NFS volume.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
