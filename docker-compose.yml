x-common: &common
    # Non-root, matching the owner of /volume1/twitch. Only the volume and /tmp are writable.
    user: 1027:100
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
    restart: unless-stopped
    volumes:
    - /volume1/twitch:/app/download

services:
  streamlink:
    <<: *common
    image: ghcr.io/liofal/streamlink:5.0.0
    deploy:
      resources:
        limits:
          # Same as the Helm chart: Python + streamlink buffers need about 100-150M while recording.
          memory: 512M
    build:
      context: .
      dockerfile: Dockerfile
    env_file: 
        # - ../global.env    
        - default.env
        - clientid.env
    container_name: streamlink_${TWITCH}
    environment:
      - user=${TWITCH}
      - quality=best

  ffmpeg:
    <<: *common
    image: ghcr.io/liofal/ffmpeg:1.0.1
    deploy:
      resources:
        limits:
          # Recommended minimum for large TS to MP4 remuxing.
          memory: 512M
    container_name: ffmpeg_converter
    environment:
      - SLEEPTIME=600
      - WORKDIR=/app/download
    
    restart: unless-stopped
